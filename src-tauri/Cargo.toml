[package]
name = "monocle-win"
version = "0.1.0"
edition = "2021"

[lib]
name = "monocle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Matrix3x2 is not re-exported by the windows crate; it lives in
# windows-numerics. cargo unifies this to the same 0.2.x the windows
# crate already depends on, so no duplicate compile.
windows-numerics = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # Local timestamps for the diagnostic log (GetLocalTime).
    "Win32_System_SystemInformation",
    # Start-on-login: HKCU\...\CurrentVersion\Run registry value.
    "Win32_System_Registry",
    # Executable version info (FileDescription) for friendly app names.
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    # Taskbar auto-hide via the shell appbar interface (SHAppBarMessage).
    "Win32_UI_Shell",
    "Win32_UI_Magnification",
    # --- blur prototype: capture + GPU blur pipeline ---
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Foundation",
    "Foundation_Numerics",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
