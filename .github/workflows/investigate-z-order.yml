name: Investigate native Z order
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Native ordering and input fixtures (no release)
        working-directory: src-tauri
        run: cargo test --locked --lib -- --test-threads=1 --nocapture
