name: Verify Windows source

# Explicit dispatch only. Builds artifacts; releases are published separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked frontend and official Tauri CLI dependencies
        run: npm ci
      - name: Show preinstalled toolchain
        run: |
          rustc --version
          cargo --version
      - name: Check Windows code
        working-directory: src-tauri
        run: cargo check --locked
      - name: Require policy tests and run library tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $listedTests = cargo test --locked --lib blur_policy::tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listedTests | Write-Output
          $policyTests = @($listedTests | Select-String '^blur_policy::tests::.+: test$')
          if ($policyTests.Count -lt 14) { throw "Expected at least 14 blur policy tests; refusing an empty or incomplete suite." }
          $allTests = cargo test --locked --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $isolationTests = @($allTests | Select-String '^(identity::tests|settings::tests|windows_api::tests|isolation_tests)::.+: test$')
          if ($isolationTests.Count -lt 7) { throw "Expected at least 7 isolation/settings tests." }
          $focusTests = @($allTests | Select-String '^focus_policy::(tests|classification_tests)::.+: test$')
          if ($focusTests.Count -lt 13) { throw "Expected at least 13 focus classification/reconciliation tests." }
          $rendererTests = @($allTests | Select-String '^renderer_policy::tests::.+: test$')
          if ($rendererTests.Count -lt 4) { throw "Expected at least 4 renderer lifecycle tests." }
          $inputTests = @($allTests | Select-String '^input_policy::tests::.+: test$')
          if ($inputTests.Count -lt 1) { throw "Expected Win32 visual input fixture." }
          cargo test --locked --lib
      - name: Build Windows executable and NSIS installer
        run: npm run build -- --ci --bundles nsis -- --locked
      - name: Package executable with source SHA, hashes and limitations
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-lite-windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.txt
            dist/LICENSE
          if-no-files-found: error
          retention-days: 1
