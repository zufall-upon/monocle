name: Verify Windows source

# Explicit dispatch only: no installer publication and no automatic build on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show preinstalled toolchain
        run: |
          rustc --version
          cargo --version
      - name: Check Windows code
        working-directory: src-tauri
        run: cargo check --locked
      - name: Require policy tests and run library tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $listedTests = cargo test --locked --lib blur_policy::tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listedTests | Write-Output
          $policyTests = @($listedTests | Select-String '^blur_policy::tests::.+: test$')
          if ($policyTests.Count -lt 10) { throw "Expected at least 10 blur policy tests; refusing an empty or incomplete suite." }
          cargo test --locked --lib
      - name: Build Windows executable without installer
        working-directory: src-tauri
        run: cargo build --locked --release
