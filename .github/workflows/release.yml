name: Release

# Builds the Windows installers and publishes a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. Can also be run manually from the
# Actions tab via "Run workflow".
#
# Note: the build is NOT code-signed, so installers will trigger a one-time
# Windows SmartScreen prompt ("More info -> Run anyway"). Adding a signing
# certificate is out of scope here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Deep ${{ github.ref_name }}"
          releaseBody: "Download the `*-setup.exe` (NSIS) or `*.msi` installer below. The build is unsigned — on first run, click **More info -> Run anyway** past Windows SmartScreen."
          releaseDraft: false
          prerelease: false
