<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monocle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="21.17" y1="8" x2="12" y2="8"/>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
          </svg>
        </div>
        <span class="titlebar-title">Monocle</span>
      </div>
      <button class="titlebar-close" id="btn-close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/>
        </svg>
      </button>
    </div>

    <div class="status-bar">
      <div class="status-indicator" id="status-dot"></div>
      <span class="status-text" id="status-text">Inactive</span>
      <button class="toggle-btn" id="btn-toggle">
        <span id="toggle-label">Activate</span>
      </button>
    </div>

    <div class="hint">Shake your mouse to toggle</div>

    <div class="controls">
      <div class="control-group">
        <div class="tint-control" id="tint-control">
          <div class="control-row tint-main">
            <button class="swatch-current control-icon" id="swatch-current" style="background:#0f172a" title="Tint color"></button>
            <span class="control-name">Tint</span>
            <input type="range" id="tint-opacity" min="0" max="100" value="40" />
          </div>
          <div class="tint-picker">
            <div class="picker-header">
              <button class="picker-back" id="picker-back" aria-label="Back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                </svg>
              </button>
              <span class="picker-name" id="picker-name">Slate</span>
            </div>
            <div class="picker-swatches">
              <input type="color" id="custom-color" value="#0f172a" class="custom-color" title="Custom color" />
              <button class="swatch" data-color="#FF3B30" data-name="Red" style="background:#FF3B30"></button>
              <button class="swatch" data-color="#FF9500" data-name="Orange" style="background:#FF9500"></button>
              <button class="swatch" data-color="#FFCC00" data-name="Yellow" style="background:#FFCC00"></button>
              <button class="swatch" data-color="#34C759" data-name="Green" style="background:#34C759"></button>
              <button class="swatch" data-color="#30B0C7" data-name="Teal" style="background:#30B0C7"></button>
              <button class="swatch" data-color="#007AFF" data-name="Blue" style="background:#007AFF"></button>
              <button class="swatch" data-color="#5856D6" data-name="Indigo" style="background:#5856D6"></button>
              <button class="swatch" data-color="#AF52DE" data-name="Purple" style="background:#AF52DE"></button>
              <button class="swatch" data-color="#DB2D9E" data-name="Magenta" style="background:#DB2D9E"></button>
              <button class="swatch" data-color="#FF375F" data-name="Pink" style="background:#FF375F"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="control-group">
        <div class="control-row">
          <span class="control-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/><circle cx="12" cy="12" r="3.5"/>
            </svg>
          </span>
          <span class="control-name">Blur</span>
          <input type="range" id="blur-intensity" min="0" max="100" value="30" />
        </div>
        <div class="seg-toggle" id="blur-mode">
          <button class="seg-btn active" data-mode="deep_focus">Deep focus</button>
          <button class="seg-btn" data-mode="ambient">Ambient</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-row">
          <span class="control-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <circle cx="6" cy="6" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="18" cy="7" r="1"/>
              <circle cx="5" cy="12" r="1"/><circle cx="11" cy="12" r="1"/><circle cx="18" cy="13" r="1"/>
              <circle cx="7" cy="18" r="1"/><circle cx="13" cy="19" r="1"/><circle cx="19" cy="18" r="1"/>
            </svg>
          </span>
          <span class="control-name">Grain</span>
          <input type="range" id="grain-amount" min="0" max="100" value="30" />
        </div>
      </div>

      <div class="control-group">
        <div class="control-row">
          <span class="control-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12c2.5-6 4.5-6 7 0s4.5 6 7 0 3-4 6-2"/>
            </svg>
          </span>
          <span class="control-name">Shake</span>
          <input type="range" id="shake-sensitivity" min="0" max="100" value="50" />
        </div>
      </div>

      <div class="control-group">
        <div class="control-row">
          <span class="control-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="control-name">Crossfade</span>
          <input type="range" id="fade-duration" min="0" max="150" value="75" />
          <span class="control-value" id="val-fade">0.75s</span>
        </div>
      </div>

    </div>

    <div class="footer">
      <div class="footer-options">
        <label class="checkbox-label">
          <input type="checkbox" id="desaturate-enabled" />
          <span class="checkmark"></span>
          Mono
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="per-monitor-focus" checked />
          <span class="checkmark"></span>
          Per-monitor focus
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="app-wide-focus" />
          <span class="checkmark"></span>
          App-wide focus
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="blur-taskbar" />
          <span class="checkmark"></span>
          Auto-hide taskbar
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="start-on-login" />
          <span class="checkmark"></span>
          Start on login
        </label>
      </div>
      <span class="version">v0.1.0</span>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
